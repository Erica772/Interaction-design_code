<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bath & Body Works</title>


</head>

<body>
    <header>
        <nav>
            <ul>
                <li>Shop</li>
                <li>Offers</li>
                <li>New</li>
                <li>Gifts</li>
            </ul>

            <img src="images/bbw-logo-black 1.png" alt="Bath & Body Works logo">

            <div class="nav-icons">
                <div class="search">
                    <img src="images/codicon_search.svg" alt="">
                    <span>Search</span>
                </div>

                <img src="images/charm_person.svg" alt="Account">
                <img src="images/bi_bag.svg" alt="Shopping bag">

            </div>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>Shop Our Newest Collection</h1>
            <p>Cozy up with our limited-time Cinnamon Spiced Vanilla collection. Featuring warm cinnamon and sweet vanilla notes, this scent brings the comfort of fall into your home.</p>
            <button type="button">Shop Collection</button>
            <img src="images/products.png" alt="">

        </section>

    </main>
    <div class="modal" id="modal">
        <button data-close-button class="close-button">
            &times;
        </button>
    
        <img src="images/modal.png" alt="Get 20% off our newest collection">
    </div>
    
    <div id="overlay"></div>
    <script src="script.js"></script>
</body>


</html>
